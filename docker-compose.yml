# Gate C1: only nginx (443 + the 8443 → https redirect) listens on all interfaces. Every other
# host port is bound to 127.0.0.1 — reachable from this machine (IntelliJ dev runs, an SSH tunnel
# on a server) but never from the network. On Linux this matters doubly: Docker-published ports
# bypass UFW, so a firewall rule alone would NOT close them. Containers talk over llm_internal.
# Gate C5: secrets are NOT env vars. Each is a file in ${SECRETS_DIR} (outside the repo; default
# ./secrets.dev = the public dev values, so a fresh clone runs as-is), mounted per service under
# /run/secrets (top-level `secrets:` at the bottom) — absent from .env, `docker inspect` and this file.
# Readers: Spring → configtree (application.yaml), postgres/grafana → *_FILE, the rest →
# scripts/file-env.sh. scripts/check-prod-env.sh refuses dev values / an in-repo SECRETS_DIR on a
# server. Runbook: docs/ops/secrets.md.
# Gate B8: bounded container logs (Docker's json-file default grows forever). Logs carry ticket/tenant
# ids by design (B3), and nginx access logs carry client IPs — personal data that must age out:
# 5 × 20 MB per container, oldest dropped. data-flow.md states this as the log retention.
# Gate C6: every long-running service has `restart: unless-stopped` — after a host reboot or a crash
# the whole stack comes back, not just the backend (which would then loop against a dead Postgres).
# Only the demo-profile mail fakes (greenmail, mailpit) are left without.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  backend:
    logging: *default-logging
    # Gate B5: room for the graceful stop (45 s phase budget) before Docker sends SIGKILL (default 10 s).
    stop_grace_period: 60s
    build: .
    # Gate C6: the JVM exits on OutOfMemoryError (Dockerfile) — Docker brings it straight back.
    # A deterministic startup failure (e.g. DevCredentialsGuard refusing dev secrets on a public host)
    # becomes a restart loop: `docker compose logs backend | grep "Refusing to start"` shows why.
    restart: unless-stopped
    # Gate C6: a leak or a huge attachment must not starve Postgres/Ollama/Keycloak on the same host.
    # Heap = 65% of this (MaxRAMPercentage); ~600 MB in steady state, the rest is parsing headroom.
    deploy:
      resources:
        limits:
          memory: 2G
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/smartfreight
      # Phase 2.2: app pool = restricted role (RLS applies); Flyway = admin (DDL).
      # DB_APP_PASSWORD (a secret, below) also feeds the V19 placeholder that creates the role.
      - SPRING_DATASOURCE_USERNAME=${DB_APP_USER:-smartfreight_app}
      - DB_ADMIN_USER=${POSTGRES_USER:-postgres}
      - OLLAMA_URL=http://ollama:11434
      # Phase 3.1: local embedding model for the AI feedback loop.
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      - PORT_SERVICE_URL=http://port-service:9000
      - IMAP_HOST=${IMAP_HOST:-imap.example.com}
      - IMAP_USER=${IMAP_USER:-inbox@example.com}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-${IMAP_USER:-inbox@example.com}}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER:-smartfreight}
      # Phase 2.6: Redis backs HTTP sessions, the rate-sheet cache and login throttling.
      - REDIS_HOST=redis
      # Phase 2.3 / 3.2 https login: Keycloak is the sole IdP, fronted by nginx on the SAME TLS
      # origin as the SPA (https://localhost/realms/...), so token `iss` is https://localhost —
      # no mixed content for the browser. The backend can't reach https://localhost (that's
      # itself), so it does NOT discover the issuer: it validates the `iss` claim against
      # KEYCLOAK_ISSUER_URI and fetches the signing keys over the compose network via
      # KEYCLOAK_JWKS_URI (keycloak:8081). Since the 3.2 cutover there is no server-side
      # oauth2-client, so the old KEYCLOAK_CLIENT_ID/SECRET (confidential web client) are gone.
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI:-https://localhost/realms/smartfreight}
      - KEYCLOAK_JWKS_URI=${KEYCLOAK_JWKS_URI:-http://keycloak:8081/realms/smartfreight/protocol/openid-connect/certs}
      # Phase 2.3 S2: Admin REST client for tenant/operator provisioning (KeycloakAdminService).
      # Realm-less base URL over the compose network; its own service-account client + secret.
      - KEYCLOAK_SERVER_URL=${KEYCLOAK_SERVER_URL:-http://keycloak:8081}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-smartfreight}
      - KEYCLOAK_ADMIN_CLIENT_ID=${KEYCLOAK_ADMIN_CLIENT_ID:-smartfreight-admin}
      # Phase 4.8 S2 demo mail harness (greenmail + mailpit below) — how to run: header of
      # scripts/demo-mail.ps1. Off (the default) REMOVES the demo mailboxes on backend start.
      - DEMO_MAIL_ENABLED=${DEMO_MAIL_ENABLED:-false}
      # Mail TLS is verified against the JVM truststore (MailTlsPolicy). Dev only: set
      # USE_SYSTEM_CA_CERTS=1 in .env to also trust the *.crt files in certs/extra-ca (e.g. an
      # antivirus that re-signs IMAPS/SMTP traffic) — see certs/extra-ca/README.md. Unset in prod.
      - USE_SYSTEM_CA_CERTS=${USE_SYSTEM_CA_CERTS:-}
    volumes:
      - ./certs/extra-ca:/certificates:ro
    # Gate C5: read by Spring's configtree import (application.yaml) — each file becomes the property
    # of the same name, so the `${DB_APP_PASSWORD:...}`-style placeholders resolve unchanged.
    # MAILBOX_ENCRYPTION_KEY: AES key for tenant_mailbox passwords (openssl rand -base64 32; empty →
    # no IMAP adapters start). IMAP/SMTP_PASSWORD: the platform account (MailboxBootstrap + fallback).
    secrets:
      - DB_APP_PASSWORD
      - source: POSTGRES_PASSWORD
        target: DB_ADMIN_PASSWORD
      - RABBITMQ_PASSWORD
      - REDIS_PASSWORD
      - KEYCLOAK_ADMIN_CLIENT_SECRET
      - PORT_SERVICE_API_KEY
      - MAILBOX_ENCRYPTION_KEY
      - IMAP_PASSWORD
      - SMTP_PASSWORD
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      port-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
      # Management port (actuator) — localhost only; nginx proxies just /actuator/health.
      - "127.0.0.1:9091:9091"
    healthcheck:
      # eclipse-temurin alpine has busybox wget but no curl (same as port-service)
      # Gate C2: actuator lives on the management port 9091 (localhost-only), never on 8080.
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Spring Boot 4 takes ~20-30s to start; give it headroom before failures count
      start_period: 60s
    networks:
      - llm_internal

  postgres:
    restart: unless-stopped
    logging: *default-logging
    # Phase 3.1: pgvector image (PG16 + the `vector` extension) for the AI feedback loop's
    # embedding similarity search. Drop-in for postgres:16 — same data, V28 enables the extension.
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=smartfreight
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      # Applied at first volume init only — rotate inside Postgres afterwards (docs/ops/secrets.md).
      - POSTGRES_PASSWORD_FILE=/run/secrets/POSTGRES_PASSWORD
    secrets:
      - POSTGRES_PASSWORD
    # Host port 5433 matches application.yaml (avoids conflict with a local PostgreSQL on 5432).
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "smartfreight"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llm_internal

  ollama:
    restart: unless-stopped
    logging: *default-logging
    image: ollama/ollama:0.3.14
    container_name: ollama
    entrypoint: ["/bin/bash", "/scripts/entrypoint.sh"]
    volumes:
      - ollama:/root/.ollama
      - ./scripts/entrypoint.sh:/scripts/entrypoint.sh:ro
    environment:
      - OLLAMA_HOST=0.0.0.0
      - MODEL_NAME=qwen2.5:7b
      - ADDITIONAL_MODEL=llama3.1:8b
      # Phase 3.1: embedding model for the AI feedback loop (pulled by entrypoint.sh).
      - EMBEDDING_MODEL=nomic-embed-text
      - OLLAMA_MAX_LOADED_MODELS=2
      # RTX 5080 16GB: обе модели занимают ~10GB, остаётся 6GB — хватает на 2 параллельных вывода
      - OLLAMA_NUM_PARALLEL=2
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 24G
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      # curl is not present in the ollama image; `ollama ls` hits the local API
      test: ["CMD", "ollama", "ls"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - llm_internal

  rabbitmq:
    restart: unless-stopped
    logging: *default-logging
    # Async AI pipeline broker (Phase 1.3). The -management image ships the web UI
    # on :15672 (login = RABBITMQ_USER/RABBITMQ_PASSWORD) — queue depths, DLQ, rates.
    image: rabbitmq:3.13-management-alpine
    # Gate C5: RABBITMQ_DEFAULT_PASS comes from the secret via file-env.sh (the image has no *_FILE).
    # Overriding the entrypoint drops the image CMD, hence the explicit command.
    entrypoint: ["/bin/sh", "/file-env.sh", "docker-entrypoint.sh"]
    command: ["rabbitmq-server"]
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-smartfreight}
    secrets:
      - source: RABBITMQ_PASSWORD
        target: RABBITMQ_DEFAULT_PASS
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
      # Prometheus scrape endpoint (rabbitmq_prometheus plugin) — exposed to the
      # host only for debugging; Prometheus scrapes it over the compose network.
      - "127.0.0.1:15692:15692"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./scripts/file-env.sh:/file-env.sh:ro
      # Declarative plugin list (adds rabbitmq_prometheus to what the -management
      # image enables) + per-queue metric granularity for Grafana panels.
      - ./monitoring/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./monitoring/rabbitmq/20-prometheus.conf:/etc/rabbitmq/conf.d/20-prometheus.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - llm_internal

  redis:
    restart: unless-stopped
    logging: *default-logging
    # Phase 2.6: HTTP session store (sessions survive a backend restart and are shared
    # across instances), rate-sheet cache, and login rate-limit counters. AOF persistence
    # so cached/session state survives a redis restart too. Always password-protected (Gate C1;
    # was empty) — the backend reads the same REDIS_PASSWORD secret.
    image: redis:7-alpine
    # Gate C5: the password goes into a root-written, redis-only config file, NOT the command line
    # (`--requirepass x` shows in `ps` and `docker inspect`). The image entrypoint still drops to
    # the redis user because its first argument is `redis-server`.
    command:
      - /bin/sh
      - -c
      - >-
        umask 077
        && pw="$$(tr -d '\r' < /run/secrets/REDIS_PASSWORD)"
        && { [ -n "$$pw" ] || { echo 'REDIS_PASSWORD is empty - refusing to start without auth' >&2; exit 1; }; }
        && printf 'requirepass "%s"\n' "$$pw" > /tmp/redis.conf
        && chown redis /tmp/redis.conf
        && exec docker-entrypoint.sh redis-server /tmp/redis.conf --appendonly yes
    secrets:
      - REDIS_PASSWORD
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      # A bare `redis-cli ping` exits 0 even on NOAUTH, so it was green regardless — require PONG.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(tr -d '\\r' < /run/secrets/REDIS_PASSWORD)\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llm_internal

  keycloak:
    restart: unless-stopped
    logging: *default-logging
    # Phase 2.3 / 3.2 https login: sole identity provider (OIDC). Realm `smartfreight` is
    # imported on first start from ./keycloak. Fronted by nginx on the SAME TLS origin as the
    # SPA: the FRONT channel is https://localhost/realms/... (KC_HOSTNAME=https://localhost +
    # KC_PROXY_HEADERS=xforwarded → Keycloak trusts nginx's X-Forwarded-Proto and builds https
    # URLs, so the token `iss` is https://localhost). The BACK channel stays internal http on
    # keycloak:8081 (backend fetches JWKS there, KeycloakAdminService provisions there);
    # KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true lets those internal calls keep using keycloak:8081.
    # No mixed content, one cert, no `127.0.0.1 keycloak` browser hosts entry needed.
    # start-dev is fine for the pilot; switch to `start` + a real hostname/TLS for production.
    image: quay.io/keycloak/keycloak:26.0
    # Gate C5: KC_BOOTSTRAP_ADMIN_PASSWORD / KC_DB_PASSWORD come from secrets via file-env.sh.
    entrypoint: ["/bin/sh", "/file-env.sh", "/opt/keycloak/bin/kc.sh"]
    command: ["start-dev", "--import-realm", "--http-port=8081"]
    secrets:
      - source: KEYCLOAK_ADMIN_PASSWORD
        target: KC_BOOTSTRAP_ADMIN_PASSWORD
      - source: KEYCLOAK_DB_PASSWORD
        target: KC_DB_PASSWORD
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USER:-admin}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=${KEYCLOAK_DB_USER:-keycloak}
      - KC_HOSTNAME=${KEYCLOAK_FRONTEND_URL:-https://localhost}
      - KC_PROXY_HEADERS=xforwarded
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
      - KC_HTTP_ENABLED=true
      - KC_HEALTH_ENABLED=true
    volumes:
      - ./keycloak/realm-smartfreight.json:/opt/keycloak/data/import/realm-smartfreight.json:ro
      - ./scripts/file-env.sh:/file-env.sh:ro
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # The image has no curl/wget; use bash /dev/tcp against the management health port (9000).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - llm_internal

  keycloak-db:
    restart: unless-stopped
    logging: *default-logging
    # Dedicated Postgres for Keycloak (mirrors port-db) — keeps IdP state isolated and
    # restoreable, separate from the application DB.
    image: postgres:16
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=${KEYCLOAK_DB_USER:-keycloak}
      - POSTGRES_PASSWORD_FILE=/run/secrets/KEYCLOAK_DB_PASSWORD
    secrets:
      - KEYCLOAK_DB_PASSWORD
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${KEYCLOAK_DB_USER:-keycloak}", "-d", "keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llm_internal

  prometheus:
    restart: unless-stopped
    logging: *default-logging
    image: prom/prometheus:v2.53.0
    # Gate B7: keep 90d (default 15d) — a 30+ day pilot must still be on the graphs at the S4
    # conversion talk. `command` replaces the image defaults, so config/storage paths are restated.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - llm_internal

  alertmanager:
    logging: *default-logging
    # Gate B4: delivers Prometheus alerts OUT of the box (Telegram) + a dead man's switch heartbeat.
    # Config is rendered from env by the entrypoint (secrets stay out of git); see docs/ops/alerting.md.
    image: prom/alertmanager:v0.27.0
    # Gate C5: the bot token and the ping URL (anyone holding it can fake "alive") are secrets;
    # the chat id is not.
    entrypoint: ["/bin/sh", "/file-env.sh", "/bin/sh", "/etc/alertmanager-src/entrypoint.sh"]
    environment:
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    secrets:
      - TELEGRAM_BOT_TOKEN
      - HEALTHCHECKS_PING_URL
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager-src:ro
      - ./scripts/file-env.sh:/file-env.sh:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped
    networks:
      - llm_internal

  grafana:
    restart: unless-stopped
    logging: *default-logging
    image: grafana/grafana:11.1.0
    environment:
      # Applied when grafana_data is first created, like the Postgres passwords.
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/GRAFANA_PASSWORD
    secrets:
      - GRAFANA_PASSWORD
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    networks:
      - llm_internal

  port-db:
    restart: unless-stopped
    logging: *default-logging
    image: postgres:16
    environment:
      - POSTGRES_DB=port_system
      - POSTGRES_USER=${PORT_DB_USER:-postgres}
      - POSTGRES_PASSWORD_FILE=/run/secrets/PORT_DB_PASSWORD
    secrets:
      - PORT_DB_PASSWORD
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - port_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "port_system"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llm_internal

  postgres-backup:
    logging: *default-logging
    # Daily compressed pg_dump → /backups, with weekly + monthly retention.
    # Restore example: gunzip < /backups/last/smartfreight-latest.sql.gz | psql -U postgres smartfreight
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=smartfreight
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD_FILE=/run/secrets/POSTGRES_PASSWORD
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080
    secrets:
      - POSTGRES_PASSWORD
    volumes:
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - llm_internal

  keycloak-backup:
    logging: *default-logging
    # Gate B1: operators (users, roles, tenant_id attribute) live in keycloak-db — without this dump a
    # restored smartfreight DB has tenants but nobody who can log in to them. Same image and retention.
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=keycloak-db
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=${KEYCLOAK_DB_USER:-keycloak}
      - POSTGRES_PASSWORD_FILE=/run/secrets/KEYCLOAK_DB_PASSWORD
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080
    secrets:
      - KEYCLOAK_DB_PASSWORD
    volumes:
      - postgres_backups:/backups
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - llm_internal

  backup-offsite:
    logging: *default-logging
    # Gate B1: encrypted offsite copy of every dump in postgres_backups (rclone crypt → S3, UK region).
    # Configured from env + secrets (monitoring/backup/offsite-env.sh); unset → idles with a warning.
    image: rclone/rclone:1.68
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/file-env.sh", "/bin/sh", "/etc/offsite/offsite.sh"]
    environment:
      - OFFSITE_S3_BUCKET=${OFFSITE_S3_BUCKET:-}
      - OFFSITE_S3_PROVIDER=${OFFSITE_S3_PROVIDER:-AWS}
      - OFFSITE_S3_REGION=${OFFSITE_S3_REGION:-eu-west-2}
      - OFFSITE_S3_ENDPOINT=${OFFSITE_S3_ENDPOINT:-}
      # Drills only (scripts/restore-test.sh offsite): a local dir instead of a bucket.
      - OFFSITE_LOCAL_DIR=${OFFSITE_LOCAL_DIR:-}
    secrets:
      - BACKUP_ENCRYPTION_PASSPHRASE
      - OFFSITE_S3_ACCESS_KEY_ID
      - OFFSITE_S3_SECRET_ACCESS_KEY
      - BACKUP_HEALTHCHECKS_PING_URL
    volumes:
      - postgres_backups:/backups:ro
      - ./monitoring/backup:/etc/offsite:ro
      - ./scripts/file-env.sh:/file-env.sh:ro
      - offsite_drill:/offsite-drill
    networks:
      - llm_internal

  nginx:
    logging: *default-logging
    # HTTPS termination in front of the backend. Self-signed cert is generated on first run.
    # For production, replace /etc/nginx/certs/server.crt and server.key with a real certificate.
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "8443:8443"
    volumes:
      - ./monitoring/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Gate C6: security headers, included by the app locations of nginx.conf.
      - ./monitoring/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      - ./monitoring/nginx/entrypoint.sh:/docker-entrypoint.d/00-generate-cert.sh:ro
      # Dev TLS cert. If monitoring/nginx/certs/ holds a server.crt/key (e.g. an mkcert-issued,
      # locally-trusted pair → green padlock on https://localhost), nginx uses it; the entrypoint
      # only generates a throwaway self-signed cert when the dir is empty (fresh clone). The dir is
      # gitignored — mkcert certs are machine-specific (signed by each dev's local CA).
      - ./monitoring/nginx/certs:/etc/nginx/certs
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - llm_internal

  port-service:
    restart: unless-stopped
    logging: *default-logging
    build:
      context: ./port-service
      dockerfile: Dockerfile
    environment:
      - DB_HOST=port-db
      - DB_PORT=5432
      - DB_USER=${PORT_DB_USER:-postgres}
      - SCHEDULER_ENABLED=${PORT_SCHEDULER_ENABLED:-false}
      - SCHEDULER_INTERVAL_MS=300000
    # Gate C5: configtree import, as in the backend.
    secrets:
      - source: PORT_DB_PASSWORD
        target: DB_PASSWORD
      - PORT_SERVICE_API_KEY
    depends_on:
      port-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - llm_internal

  greenmail:
    logging: *default-logging
    # Phase 4.8 S2 demo mail harness: fake mail server holding the demo tenants' inboxes.
    # scripts/demo-mail.ps1 drops scenario emails in over SMTP :3025; the backend's IMAP IDLE
    # adapters read them over IMAPS :3993 (self-signed cert — MailTlsPolicy trusts THIS host, and
    # only while DEMO_MAIL_ENABLED; every other mailbox is verified against the JVM truststore).
    # auth.disabled: any login is accepted and a mailbox exists per address on first use, so the
    # demo addresses live in ONE place (application.yaml demo.mail.inboxes) — fake data only.
    # Host ports bound to 127.0.0.1: nothing outside this machine needs the demo mail servers.
    image: greenmail/standalone:2.1.2
    profiles: ["demo"]
    # The bundled cert doesn't name `greenmail`/`localhost`, and Angus Mail 2.x verifies the
    # server hostname even with ssl.trust — so mint a throwaway self-signed cert with the right
    # SANs at every start (no key material in the repo) instead of weakening the adapter's TLS.
    # rm -f first: /tmp survives a container restart, and keytool refuses an existing alias.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        rm -f /tmp/demo-tls.p12
        && keytool -genkeypair -alias greenmail -keyalg RSA -keysize 2048 -validity 3650
        -dname CN=greenmail -ext SAN=dns:greenmail,dns:localhost -storetype PKCS12
        -keystore /tmp/demo-tls.p12 -storepass changeit -keypass changeit
        && exec /home/greenmail/run_greenmail.sh
    environment:
      - GREENMAIL_OPTS=-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.tls.keystore.file=/tmp/demo-tls.p12 -Dgreenmail.tls.keystore.password=changeit -Dgreenmail.auth.disabled
    ports:
      - "127.0.0.1:3025:3025"
      - "127.0.0.1:3993:3993"
    networks:
      - llm_internal

  mailpit:
    logging: *default-logging
    # Phase 4.8 S2: catches every reply the demo tenants send — http://localhost:8025 is the
    # customer's view of the conversation during a demo. Accepts any SMTP credentials.
    image: axllent/mailpit:v1.21
    profiles: ["demo"]
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - llm_internal

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  keycloak_db_data:
  postgres_backups:
  ollama:
  prometheus_data:
  alertmanager_data:
  offsite_drill:
  grafana_data:
  port_db_data:
  nginx_certs:

networks:
  llm_internal:
    driver: bridge

# Gate C5: one file per secret in SECRETS_DIR (set in .env; must be OUTSIDE the repo on a real
# host). The default ./secrets.dev holds only the public dev values. File name = secret name; a
# service mounts only the ones it lists, under /run/secrets/<name or target>.
secrets:
  POSTGRES_PASSWORD:
    file: ${SECRETS_DIR:-./secrets.dev}/POSTGRES_PASSWORD
  DB_APP_PASSWORD:
    file: ${SECRETS_DIR:-./secrets.dev}/DB_APP_PASSWORD
  RABBITMQ_PASSWORD:
    file: ${SECRETS_DIR:-./secrets.dev}/RABBITMQ_PASSWORD
  REDIS_PASSWORD:
    file: ${SECRETS_DIR:-./secrets.dev}/REDIS_PASSWORD
  KEYCLOAK_ADMIN_PASSWORD:
    file: ${SECRETS_DIR:-./secrets.dev}/KEYCLOAK_ADMIN_PASSWORD
  KEYCLOAK_DB_PASSWORD:
    file: ${SECRETS_DIR:-./secrets.dev}/KEYCLOAK_DB_PASSWORD
  KEYCLOAK_ADMIN_CLIENT_SECRET:
    file: ${SECRETS_DIR:-./secrets.dev}/KEYCLOAK_ADMIN_CLIENT_SECRET
  GRAFANA_PASSWORD:
    file: ${SECRETS_DIR:-./secrets.dev}/GRAFANA_PASSWORD
  PORT_DB_PASSWORD:
    file: ${SECRETS_DIR:-./secrets.dev}/PORT_DB_PASSWORD
  PORT_SERVICE_API_KEY:
    file: ${SECRETS_DIR:-./secrets.dev}/PORT_SERVICE_API_KEY
  MAILBOX_ENCRYPTION_KEY:
    file: ${SECRETS_DIR:-./secrets.dev}/MAILBOX_ENCRYPTION_KEY
  IMAP_PASSWORD:
    file: ${SECRETS_DIR:-./secrets.dev}/IMAP_PASSWORD
  SMTP_PASSWORD:
    file: ${SECRETS_DIR:-./secrets.dev}/SMTP_PASSWORD
  TELEGRAM_BOT_TOKEN:
    file: ${SECRETS_DIR:-./secrets.dev}/TELEGRAM_BOT_TOKEN
  HEALTHCHECKS_PING_URL:
    file: ${SECRETS_DIR:-./secrets.dev}/HEALTHCHECKS_PING_URL
  BACKUP_ENCRYPTION_PASSPHRASE:
    file: ${SECRETS_DIR:-./secrets.dev}/BACKUP_ENCRYPTION_PASSPHRASE
  OFFSITE_S3_ACCESS_KEY_ID:
    file: ${SECRETS_DIR:-./secrets.dev}/OFFSITE_S3_ACCESS_KEY_ID
  OFFSITE_S3_SECRET_ACCESS_KEY:
    file: ${SECRETS_DIR:-./secrets.dev}/OFFSITE_S3_SECRET_ACCESS_KEY
  BACKUP_HEALTHCHECKS_PING_URL:
    file: ${SECRETS_DIR:-./secrets.dev}/BACKUP_HEALTHCHECKS_PING_URL
