services:
  backend:
    build: .
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/smartfreight
      # Phase 2.2: app pool = restricted role (RLS applies); Flyway = admin (DDL).
      # DB_APP_PASSWORD also feeds the V19 placeholder that creates the role.
      - SPRING_DATASOURCE_USERNAME=${DB_APP_USER:-smartfreight_app}
      - SPRING_DATASOURCE_PASSWORD=${DB_APP_PASSWORD:-smartfreight_app}
      - DB_APP_PASSWORD=${DB_APP_PASSWORD:-smartfreight_app}
      - DB_ADMIN_USER=${POSTGRES_USER:-postgres}
      - DB_ADMIN_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - OLLAMA_URL=http://ollama:11434
      # Phase 3.1: local embedding model for the AI feedback loop.
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      - PORT_SERVICE_URL=http://port-service:9000
      - PORT_SERVICE_API_KEY=${PORT_SERVICE_API_KEY:-smartfreight-port-secret}
      - IMAP_HOST=${IMAP_HOST:-imap.example.com}
      - IMAP_USER=${IMAP_USER:-inbox@example.com}
      - IMAP_PASSWORD=${IMAP_PASSWORD:-changeme}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-${IMAP_USER:-inbox@example.com}}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-${IMAP_PASSWORD:-changeme}}
      # Phase 2.2 S3: AES key for tenant_mailbox passwords (base64, 32 bytes;
      # openssl rand -base64 32). Without it no IMAP adapters start.
      - MAILBOX_ENCRYPTION_KEY=${MAILBOX_ENCRYPTION_KEY:-}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER:-smartfreight}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-smartfreight}
      # Phase 2.6: Redis backs HTTP sessions, the rate-sheet cache and login throttling.
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # Phase 2.3: Keycloak is the sole IdP. The issuer must be the SAME host:port for the
      # browser redirect and this backend's discovery call — both use keycloak:8081 (browsers
      # need a `127.0.0.1 keycloak` hosts entry on the dev machine; see CLAUDE.md).
      - KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI:-http://keycloak:8081/realms/smartfreight}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-smartfreight-inbox}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-smartfreight-inbox-secret}
      # Phase 2.3 S2: Admin REST client for tenant/operator provisioning (KeycloakAdminService).
      # Realm-less base URL over the compose network; its own service-account client + secret.
      - KEYCLOAK_SERVER_URL=${KEYCLOAK_SERVER_URL:-http://keycloak:8081}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-smartfreight}
      - KEYCLOAK_ADMIN_CLIENT_ID=${KEYCLOAK_ADMIN_CLIENT_ID:-smartfreight-admin}
      - KEYCLOAK_ADMIN_CLIENT_SECRET=${KEYCLOAK_ADMIN_CLIENT_SECRET:-smartfreight-admin-secret}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      port-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      # eclipse-temurin alpine has busybox wget but no curl (same as port-service)
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Spring Boot 4 takes ~20-30s to start; give it headroom before failures count
      start_period: 60s
    networks:
      - llm_internal

  postgres:
    # Phase 3.1: pgvector image (PG16 + the `vector` extension) for the AI feedback loop's
    # embedding similarity search. Drop-in for postgres:16 — same data, V28 enables the extension.
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=smartfreight
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    # Host port 5433 matches application.yaml (avoids conflict with a local PostgreSQL on 5432).
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "smartfreight"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llm_internal

  ollama:
    image: ollama/ollama:0.3.14
    container_name: ollama
    entrypoint: ["/bin/bash", "/scripts/entrypoint.sh"]
    volumes:
      - ollama:/root/.ollama
      - ./scripts/entrypoint.sh:/scripts/entrypoint.sh:ro
    environment:
      - OLLAMA_HOST=0.0.0.0
      - MODEL_NAME=qwen2.5:7b
      - ADDITIONAL_MODEL=llama3.1:8b
      # Phase 3.1: embedding model for the AI feedback loop (pulled by entrypoint.sh).
      - EMBEDDING_MODEL=nomic-embed-text
      - OLLAMA_MAX_LOADED_MODELS=2
      # RTX 5080 16GB: обе модели занимают ~10GB, остаётся 6GB — хватает на 2 параллельных вывода
      - OLLAMA_NUM_PARALLEL=2
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 24G
    ports:
      - "11434:11434"
    healthcheck:
      # curl is not present in the ollama image; `ollama ls` hits the local API
      test: ["CMD", "ollama", "ls"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - llm_internal

  rabbitmq:
    # Async AI pipeline broker (Phase 1.3). The -management image ships the web UI
    # on :15672 (login = RABBITMQ_USER/RABBITMQ_PASSWORD) — queue depths, DLQ, rates.
    image: rabbitmq:3.13-management-alpine
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-smartfreight}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-smartfreight}
    ports:
      - "5672:5672"
      - "15672:15672"
      # Prometheus scrape endpoint (rabbitmq_prometheus plugin) — exposed to the
      # host only for debugging; Prometheus scrapes it over the compose network.
      - "15692:15692"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      # Declarative plugin list (adds rabbitmq_prometheus to what the -management
      # image enables) + per-queue metric granularity for Grafana panels.
      - ./monitoring/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./monitoring/rabbitmq/20-prometheus.conf:/etc/rabbitmq/conf.d/20-prometheus.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - llm_internal

  redis:
    # Phase 2.6: HTTP session store (sessions survive a backend restart and are shared
    # across instances), rate-sheet cache, and login rate-limit counters. AOF persistence
    # so cached/session state survives a redis restart too. Optional password via env.
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llm_internal

  keycloak:
    # Phase 2.3: sole identity provider (OIDC). Realm `smartfreight` is imported on first
    # start from ./keycloak. Runs on port 8081 — the SAME host:port the browser and the
    # backend both use (KC_HOSTNAME pins the issuer to http://keycloak:8081), so the token
    # `iss` matches on the front channel (browser, via a `127.0.0.1 keycloak` hosts entry)
    # and the back channel (backend, over the compose network). start-dev is fine for the
    # pilot; switch to `start` + a real hostname/TLS for production.
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--http-port=8081"]
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USER:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=${KEYCLOAK_DB_USER:-keycloak}
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD:-keycloak}
      - KC_HOSTNAME=http://keycloak:8081
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=false
      - KC_HTTP_ENABLED=true
      - KC_HEALTH_ENABLED=true
    volumes:
      - ./keycloak/realm-smartfreight.json:/opt/keycloak/data/import/realm-smartfreight.json:ro
    ports:
      - "8081:8081"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # The image has no curl/wget; use bash /dev/tcp against the management health port (9000).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - llm_internal

  keycloak-db:
    # Dedicated Postgres for Keycloak (mirrors port-db) — keeps IdP state isolated and
    # restoreable, separate from the application DB.
    image: postgres:16
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=${KEYCLOAK_DB_USER:-keycloak}
      - POSTGRES_PASSWORD=${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${KEYCLOAK_DB_USER:-keycloak}", "-d", "keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llm_internal

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - llm_internal

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - llm_internal

  port-db:
    image: postgres:16
    environment:
      - POSTGRES_DB=port_system
      - POSTGRES_USER=${PORT_DB_USER:-postgres}
      - POSTGRES_PASSWORD=${PORT_DB_PASSWORD:-postgres}
    ports:
      - "5435:5432"
    volumes:
      - port_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "port_system"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llm_internal

  postgres-backup:
    # Daily compressed pg_dump → /backups, with weekly + monthly retention.
    # Restore example: gunzip < /backups/last/smartfreight-latest.sql.gz | psql -U postgres smartfreight
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=smartfreight
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080
    volumes:
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - llm_internal

  nginx:
    # HTTPS termination in front of the backend. Self-signed cert is generated on first run.
    # For production, replace /etc/nginx/certs/server.crt and server.key with a real certificate.
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "8443:8443"
    volumes:
      - ./monitoring/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./monitoring/nginx/entrypoint.sh:/docker-entrypoint.d/00-generate-cert.sh:ro
      - nginx_certs:/etc/nginx/certs
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - llm_internal

  port-service:
    build:
      context: ./port-service
      dockerfile: Dockerfile
    environment:
      - DB_HOST=port-db
      - DB_PORT=5432
      - DB_USER=${PORT_DB_USER:-postgres}
      - DB_PASSWORD=${PORT_DB_PASSWORD:-postgres}
      - SCHEDULER_INTERVAL_MS=300000
      - PORT_SERVICE_API_KEY=${PORT_SERVICE_API_KEY:-smartfreight-port-secret}
    depends_on:
      port-db:
        condition: service_healthy
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - llm_internal

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  keycloak_db_data:
  postgres_backups:
  ollama:
  prometheus_data:
  grafana_data:
  port_db_data:
  nginx_certs:

networks:
  llm_internal:
    driver: bridge
