groups:
  - name: smart-freight-inbox
    interval: 30s
    rules:

      - alert: BackendDown
        expr: up{job="smart-freight-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Smart Freight backend is unreachable"
          description: "/actuator/prometheus has not responded for 1 minute. Operator UI is offline."

      - alert: PortServiceDown
        expr: up{job="smart-freight-port-service"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Port lookup service is down"
          description: "Container data lookups will silently fall back to 'not found' for the duration of this outage."

      - alert: HighFailedTicketRate
        expr: increase(smartfreight_tickets_status_total{status="FAILED"}[10m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 5 tickets transitioned to FAILED in the last 10 minutes"
          description: "Check Ollama health and recent error logs. Run POST /admin/reprocess after the root cause is fixed."

      - alert: OllamaSlowResponse
        expr: |
          (rate(smartfreight_ollama_request_seconds_sum[5m])
           / rate(smartfreight_ollama_request_seconds_count[5m])) > 60
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Ollama average response time above 60s for 10 minutes"
          description: "Model {{ $labels.model }} ({{ $labels.operation }}) is responding slowly. Check GPU utilisation."

      - alert: ExtractionFallbackSpike
        expr: increase(smartfreight_extraction_fallback_total[15m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LLM extraction is falling back to regex frequently"
          description: "More than 10 fallbacks in the last 15 minutes. Likely Ollama timeouts or model unloaded."

      - alert: ReplySendFailures
        expr: increase(smartfreight_replies_total{result="failed"}[5m]) > 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "More than 3 operator reply sends failed in the last 5 minutes"
          description: "Check SMTP credentials and outbound connectivity."

      - alert: TicketBacklogGrowing
        expr: sum(smartfreight_tickets_current_count{status=~"NEW|RETRY_LATER"}) > 50
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Unprocessed ticket backlog exceeds 50"
          description: "The AI pipeline is not keeping up with incoming volume."

      - alert: DeadLetterQueueNotEmpty
        expr: rabbitmq_queue_messages{queue="q.ticket.process.dlq"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Poison messages in the AI pipeline DLQ"
          description: >-
            {{ $value }} message(s) were rejected 3 times by the consumer and dead-lettered.
            Inspect via the RabbitMQ UI (:15672) or GET /admin/dlq, then fix the cause and
            POST /admin/dlq/requeue — or /admin/dlq/purge if the payloads are garbage.

      - alert: OutboxRelayStalled
        expr: smartfreight_outbox_oldest_pending_age_seconds > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Outbox events are not reaching RabbitMQ"
          description: >-
            The oldest unpublished outbox event has been waiting over 5 minutes —
            the relay is failing or the broker is rejecting publishes. Tickets keep
            being ingested but the AI pipeline is not seeing them. Check RabbitMQ
            health and backend logs for OutboxRelay warnings.

      - alert: SlaBreaches
        expr: increase(smartfreight_sla_breached_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Tickets are missing their reply-by SLA"
          description: >-
            {{ $value }} ticket(s) crossed their SLA deadline in the last 15 minutes
            while still open. Check the /tickets list sorted by SLA — the operator
            queue may be overloaded or the pipeline may be stuck.

      - alert: AutoSendFailures
        expr: increase(smartfreight_autosend_total{result="failed"}[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Automatic reply sends are failing"
          description: >-
            Auto-send attempted to reply without an operator and SMTP failed.
            The tickets remain DRAFT_READY but nobody was notified (auto-send skips
            the Gmail draft) — review them in the UI and check SMTP connectivity.

      - alert: CircuitBreakerOpen
        expr: max by (name) (resilience4j_circuitbreaker_state{state="open"}) == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Circuit breaker '{{ $labels.name }}' is open"
          description: >-
            The {{ $labels.name }} dependency has been failing and its breaker opened.
            ollama: tickets are parked as RETRY_LATER and will be processed automatically
            after recovery. portService: drafts are generated without item data.
            Check the dependency's container health.

      - alert: RabbitMQDown
        expr: up{job="rabbitmq"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "RabbitMQ metrics endpoint is unreachable"
          description: >-
            The broker (or its prometheus plugin) is down. Ingestion still works —
            events accumulate in the outbox — but no AI processing happens until
            the broker returns.

      # Gate B4/B13: a mailbox we cannot log in to receives nothing — the pilot goes silent without
      # an error anywhere the operator looks. Probed every ~5 min by MailboxHealthMonitor; the tenant
      # label says WHOSE mailbox (client A's incident is not a platform outage). Ids, not addresses:
      # /settings shows the address and the masked error.
      - alert: MailboxDown
        expr: smartfreight_mailbox_up == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Tenant {{ $labels.tenant }}: mailbox {{ $labels.mailbox }} — IMAP login failing"
          description: >-
            No new email is ingested from this mailbox. Usual causes: revoked app password,
            changed account password, expired/changed certificate. The error is on /settings
            (badge "Login failed"); fix the credentials there with Edit.


      # Gate B5: catch-up only finds emails the IDLE adapter missed. A few after a restart are
      # expected; recoveries that keep coming mean IDLE for this mailbox is not delivering.
      - alert: MailboxCatchUpRecovering
        expr: increase(smartfreight_mailbox_catchup_ingested_total[30m]) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Tenant {{ $labels.tenant }}: mailbox {{ $labels.mailbox }} — IDLE keeps missing emails"
          description: >-
            For 30+ minutes emails reach this mailbox only through the 5-minute catch-up, not live
            IDLE — replies are delayed up to 5 min. Check the backend log for this mailbox's IMAP
            adapter; a restart of the backend re-creates it.

  # Dead man's switch (Gate B4): always firing. Alertmanager forwards it to an external heartbeat
  # (HEALTHCHECKS_PING_URL); when the host, Prometheus or Alertmanager dies, the pings stop and the
  # external service raises the alarm that this stack no longer can.
  - name: meta
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Alerting pipeline heartbeat — always firing, by design"
