global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'smart-freight-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']

  # port-service secures /api/v1/** and most of /actuator/** with an X-API-Key header.
  # Prometheus cannot send custom request headers in scrape_configs, so /actuator/prometheus
  # is intentionally left open at the application level and must be protected by network
  # isolation in production (private network / internal management port / firewall).
  - job_name: 'smart-freight-port-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:9000']

  # RabbitMQ always runs inside compose (unlike backend, which may run from
  # IntelliJ on the host), so it is scraped by service name, not host.docker.internal.
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
