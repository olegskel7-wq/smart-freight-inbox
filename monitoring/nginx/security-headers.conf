# Gate C6: browser-side hardening for everything the backend serves (SPA shell, /api, /ws).
# Included per location: nginx drops server-level add_header in any location that sets its own,
# so the full set lives here and every app location includes it. Keycloak (/realms/, /resources/)
# is NOT given these — it sends its own CSP/X-Frame-Options for the login pages, and a second,
# stricter CSP on top would break them. HSTS ($hsts, see the map in default.conf) is set there too.

# Spring Security sends its own defaults (X-Frame-Options DENY, HSTS with includeSubDomains, nosniff).
# Two differing X-Frame-Options make browsers treat the header as invalid, so nginx is the single
# owner of these at the edge: drop the backend's copies, send ours below.
proxy_hide_header X-Frame-Options;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;

# HTTPS only for this host for a year. Empty on localhost (see the map) — HSTS ignores ports, so on
# localhost it would also force https onto Grafana/Mailpit/backend:8080 in the dev browser.
add_header Strict-Transport-Security $hsts always;

# Never sniff a JSON/attachment response into something executable.
add_header X-Content-Type-Options "nosniff" always;

# Clickjacking: only our own origin may frame us (oidc-client-ts silent renew may use a same-origin
# iframe). frame-ancestors is the modern form; X-Frame-Options covers old browsers.
add_header X-Frame-Options "SAMEORIGIN" always;

# Our URLs (ticket ids, filters) never leave as a full Referer to another site.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# The SPA is a self-contained Vite bundle: scripts, styles, fonts and charts all come from this
# origin (no CDN, by design). Keycloak is on the same origin (/realms/), so login, token refresh and
# a silent-renew iframe are 'self'. connect-src names wss:// explicitly — older browsers do not
# treat 'self' as covering the WebSocket scheme. 'unsafe-inline' for styles only: React/Bootstrap
# set some inline styles; inline SCRIPT stays forbidden, which is what stops injected markup from
# running. blob: images = downloaded attachments shown via object URLs.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://$host; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
