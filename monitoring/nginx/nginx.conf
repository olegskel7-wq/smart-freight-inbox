# HTTPS reverse proxy for Smart Freight Inbox.
# TEMPLATE: entrypoint.sh renders it into conf.d/default.conf at container start, replacing only
# ${PUBLIC_HOST} (envsubst with an explicit variable list — nginx's own $host/$remote_addr stay).
# Gate C4: the certificate under /etc/nginx/tls is a symlink entrypoint.sh points at the Let's Encrypt
# certificate for PUBLIC_HOST once certbot has issued one, else at the local certs/ pair.

# Gate C6: HSTS on every real hostname, never on localhost (HSTS ignores ports — on localhost it would
# force https onto every other dev UI too). An empty value makes add_header send nothing.
map $host $hsts {
    localhost  "";
    127.0.0.1  "";
    default    "max-age=31536000";
}

# Gate C6: per-client-IP request rate limits (a flood or a scripted login burst is cut at the proxy,
# before it costs the backend, Postgres or Keycloak anything). Keycloak's own brute-force lockout
# stays the per-account layer. Generous on the app: an office of operators behind one NAT shares an
# IP, and a page load + the live list's refetches is a burst of a dozen requests.
limit_req_zone $binary_remote_addr zone=app:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_req_status 429;
limit_req_log_level warn;

server {
    listen 443 ssl ${DEFAULT_SERVER};
    http2 on;
    # Gate C4: the real name. ${DEFAULT_SERVER} = default_server locally (a client sending no SNI — an
    # IP literal — still gets the app), empty on a server, where entrypoint.sh's catch-all
    # (unknown-host.conf) takes all other names instead.
    server_name ${PUBLIC_HOST};

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Increase upload limit for multipart drafts.
    client_max_body_size 12m;

    # Don't advertise the nginx version in error pages / the Server header.
    server_tokens off;

    # STOMP-over-WebSocket for real-time ticket updates (Phase 3.2). The Upgrade/Connection
    # headers are required for the HTTP→WebSocket handshake; the long read timeout keeps an idle
    # operator's connection alive (STOMP heartbeats also run under it).
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Keycloak behind the same TLS origin (Phase 3.2 https login). The browser does OIDC
    # (discovery, the login page + its /resources assets, token, logout) against
    # https://${PUBLIC_HOST}/realms/... (localhost on a dev machine) — same origin as the SPA, so no mixed-content block and a
    # single cert to trust. nginx forwards to Keycloak's internal http port; the X-Forwarded-*
    # headers (with KC_PROXY_HEADERS=xforwarded) make Keycloak build https://${PUBLIC_HOST} URLs, so
    # the token `iss` is https://${PUBLIC_HOST}/realms/smartfreight. The SPA serves its own assets
    # under /assets, never /realms or /resources, so these never shadow the app.
    location /realms/ {
        # Login form posts, token refreshes, logout — a scripted password burst stops here.
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://keycloak:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
    }
    location /resources/ {
        proxy_pass http://keycloak:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
    }

    # Gate C2: actuator is on the backend's management port 9091 (localhost-only). Only the liveness
    # probe is exposed (external uptime ping, Gate B4) — status only, details need auth. Metrics
    # and anything else under /actuator/ are never served from outside.
    location = /actuator/health {
        proxy_pass http://backend:9091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /actuator/ {
        return 404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        # SPA shell + assets + /api. burst absorbs a page load; sustained >20 req/s from one IP → 429.
        limit_req zone=app burst=60 nodelay;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        # Stream-friendly buffers for long Ollama-backed requests.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

# Plain http (container port 80; host port NGINX_HTTP_PORT — 8443 locally, 80 on a server).
# Gate C4: Let's Encrypt http-01 challenges are answered from the webroot certbot writes to;
# everything else is redirected to https.
server {
    listen 80 ${DEFAULT_SERVER};
    server_name ${PUBLIC_HOST};
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
