# HTTPS reverse proxy for Smart Freight Inbox.
# Replace the self-signed cert with a real one (Let's Encrypt / corporate CA) for production.

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Increase upload limit for multipart drafts.
    client_max_body_size 12m;

    # STOMP-over-WebSocket for real-time ticket updates (Phase 3.2). The Upgrade/Connection
    # headers are required for the HTTP→WebSocket handshake; the long read timeout keeps an idle
    # operator's connection alive (STOMP heartbeats also run under it).
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        # Stream-friendly buffers for long Ollama-backed requests.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

# Optional plaintext listener on 8443 that redirects to HTTPS.
# Keeps the conventional http→https UX without binding privileged port 80.
server {
    listen 8443;
    server_name _;
    return 301 https://$host$request_uri;
}
