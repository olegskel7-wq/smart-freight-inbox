# HTTPS reverse proxy for Smart Freight Inbox.
# Replace the self-signed cert with a real one (Let's Encrypt / corporate CA) for production.

# Gate C6: HSTS on every real hostname, never on localhost (HSTS ignores ports — on localhost it would
# force https onto every other dev UI too). An empty value makes add_header send nothing.
map $host $hsts {
    localhost  "";
    127.0.0.1  "";
    default    "max-age=31536000";
}

# Gate C6: per-client-IP request rate limits (a flood or a scripted login burst is cut at the proxy,
# before it costs the backend, Postgres or Keycloak anything). Keycloak's own brute-force lockout
# stays the per-account layer. Generous on the app: an office of operators behind one NAT shares an
# IP, and a page load + the live list's refetches is a burst of a dozen requests.
limit_req_zone $binary_remote_addr zone=app:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_req_status 429;
limit_req_log_level warn;

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Increase upload limit for multipart drafts.
    client_max_body_size 12m;

    # Don't advertise the nginx version in error pages / the Server header.
    server_tokens off;

    # Gate C6: locations without their own add_header (Keycloak, /actuator/health) inherit this;
    # the app locations include security-headers.conf, which repeats it.
    add_header Strict-Transport-Security $hsts always;

    # STOMP-over-WebSocket for real-time ticket updates (Phase 3.2). The Upgrade/Connection
    # headers are required for the HTTP→WebSocket handshake; the long read timeout keeps an idle
    # operator's connection alive (STOMP heartbeats also run under it).
    location /ws {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Keycloak behind the same TLS origin (Phase 3.2 https login). The browser does OIDC
    # (discovery, the login page + its /resources assets, token, logout) against
    # https://localhost/realms/... — same origin as the SPA, so no mixed-content block and a
    # single cert to trust. nginx forwards to Keycloak's internal http port; the X-Forwarded-*
    # headers (with KC_PROXY_HEADERS=xforwarded) make Keycloak build https://localhost URLs, so
    # the token `iss` is https://localhost/realms/smartfreight. The SPA serves its own assets
    # under /assets, never /realms or /resources, so these never shadow the app.
    location /realms/ {
        # Login form posts, token refreshes, logout — a scripted password burst stops here.
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://keycloak:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
    }
    location /resources/ {
        proxy_pass http://keycloak:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
    }

    # Gate C2: actuator is on the backend's management port 9091 (localhost-only). Only the liveness
    # probe is exposed (external uptime ping, Gate B4) — status only, details need auth. Metrics
    # and anything else under /actuator/ are never served from outside.
    location = /actuator/health {
        proxy_pass http://backend:9091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /actuator/ {
        return 404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        # SPA shell + assets + /api. burst absorbs a page load; sustained >20 req/s from one IP → 429.
        limit_req zone=app burst=60 nodelay;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        # Stream-friendly buffers for long Ollama-backed requests.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

# Optional plaintext listener on 8443 that redirects to HTTPS.
# Keeps the conventional http→https UX without binding privileged port 80.
server {
    listen 8443;
    server_name _;
    return 301 https://$host$request_uri;
}
