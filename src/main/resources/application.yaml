server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 8h

spring:
  application:
    name: smart-freight-inbox

  thymeleaf:
    cache: false

  # Phase 2.2: the app runs as the NON-privileged role smartfreight_app (created by V19) —
  # RLS does not bind superusers, so connecting as postgres would silently disable tenant
  # isolation. Flyway keeps admin credentials below (DDL + role creation).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/smartfreight}
    username: ${DB_APP_USER:smartfreight_app}
    password: ${DB_APP_PASSWORD:smartfreight_app}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    connect-retries: 5
    ignore-migration-patterns: "*:missing"
    # Migrations run as the DB admin (DDL, CREATE ROLE, RLS policies) while the app pool
    # above uses the restricted role. Boot builds a separate Flyway datasource from these.
    url: ${spring.datasource.url}
    user: ${DB_ADMIN_USER:postgres}
    password: ${DB_ADMIN_PASSWORD:postgres}
    placeholders:
      # Password V19 assigns to the smartfreight_app role at creation. Keep in sync with
      # spring.datasource.password — both default to the same env var.
      app_db_password: ${DB_APP_PASSWORD:smartfreight_app}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:smartfreight}
    password: ${RABBITMQ_PASSWORD:smartfreight}
    # Publisher confirms: OutboxRelay marks an event published only after the broker acks it.
    publisher-confirm-type: correlated

  # Redis (Phase 2.6) — HTTP session store, rate-sheet cache, login rate-limit counters.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # We use Redis only as a session/cache/counter store, not for Spring Data Redis
      # repositories — disabling the scan stops it from probing every JPA repository.
      repositories:
        enabled: false

  # Sessions live in Redis: they survive a backend restart and are shared across instances
  # (closes Known Issue "session-based auth does not scale horizontally"). The store type is
  # auto-detected from the classpath in Boot 4 (no spring.session.store-type any more). Timeout
  # is read from server.servlet.session.timeout (8h) above. JDK serialization — Boot 4 has no
  # Jackson 2 ObjectMapper bean, so the principal (TenantUserDetails) must be Serializable.
  session:
    data:
      redis:
        namespace: smartfreight:session

  # Rate-sheet lookups (RateSheetCache) are cached in Redis, keyed per tenant. TTL is a
  # safety net (see CacheConfig); the authoritative invalidation is eviction on CSV import.
  cache:
    type: redis

  # OAuth2/OIDC (Phase 2.3) — Keycloak is the sole identity provider. Since the Phase 3.2
  # cutover the browser logs in directly against Keycloak via PKCE (public client
  # `smartfreight-spa`); there is no server-side oauth2-client login flow anymore. The backend
  # only validates the SPA's bearer tokens as a resource server below.
  security:
    oauth2:
      # Resource server (Phase 3.2 / https login) — the React SPA calls /api/** (and connects the
      # STOMP /ws) with a Keycloak bearer token. Keycloak is fronted by nginx, so the token `iss`
      # is the public https://localhost/realms/smartfreight, which the backend CANNOT reach (that
      # host is the backend itself). So we split the two concerns: validate the `iss` claim against
      # issuer-uri (no discovery call), and fetch the signing keys from jwk-set-uri over the compose
      # network (keycloak:8081). Setting both makes Spring build the decoder from jwk-set-uri and add
      # an issuer validator for issuer-uri — no network call to the public issuer. The same JwtDecoder
      # bean backs both the /api chain and StompAuthChannelInterceptor.
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://localhost/realms/smartfreight}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://keycloak:8081/realms/smartfreight/protocol/openid-connect/certs}

  # Legacy single-mailbox config (pre-S3). Used ONLY by MailboxBootstrap to import the
  # mailbox into tenant_mailbox on first start. Adapters (and Gmail drafts, which go into
  # the ticket's own mailbox) are built from tenant_mailbox rows — manage mailboxes on
  # /settings. Placeholder values = nothing to import.
  mail:
    host: ${IMAP_HOST:imap.example.com}
    port: ${IMAP_PORT:993}
    username: ${IMAP_USER:inbox@example.com}
    password: ${IMAP_PASSWORD:changeme}
    properties:
      mail:
        imap:
          connectiontimeout: 10000
          timeout: 60000
          ssl:
            enable: true

smtp:
  host: ${SMTP_HOST:smtp.gmail.com}
  port: ${SMTP_PORT:587}
  username: ${SMTP_USER:inbox@example.com}
  password: ${SMTP_PASSWORD:changeme}

ollama:
  base-url: ${OLLAMA_URL:http://localhost:11434}
  extraction-model: qwen2.5:7b
  drafting-model: llama3.1:8b
  # Phase 3.1: local embedding model for the AI feedback loop (RAG over operator corrections).
  embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

# Async AI pipeline (Phase 1.3)
ai-pipeline:
  # Concurrent RabbitMQ consumers = max AI pipelines in flight.
  # Keep in sync with OLLAMA_NUM_PARALLEL in docker-compose.yml.
  consumer-concurrency: 2

outbox:
  poll-interval-ms: 2000
  batch-size: 50

# Runtime sweep for tickets stuck in NEW/PROCESSING (lost pipeline message).
# stuck-after-minutes must exceed worst-case healthy wait: queue backlog + one pipeline run.
sweep:
  poll-interval-ms: 300000
  stuck-after-minutes: 30

# SLA reply windows per ticket type, minutes (Phase 1.5). Deadline = createdAt + window.
# Types missing from the map (incl. GENERAL) fall back to default-minutes.
sla:
  breach-check-interval-ms: 60000
  default-minutes: 480           # 8h — GENERAL and anything unlisted
  escalation-factor: 0.5         # Phase 3.10: HIGH urgency / negative sentiment → half the SLA window
  minutes:
    rfq: 120                     # quotes go cold fast
    booking-confirm: 30          # operational, time-critical
    status-update: 240
    invoice-query: 480
    document-request: 480

# Circuit breakers (Phase 1.7). How long a breaker stays OPEN before a probe call.
# While the ollama breaker is OPEN the pipeline parks tickets as RETRY_LATER (proper AI
# draft after recovery) and RetryScheduler pauses re-enqueueing; an open port-service
# breaker only degrades lookups to "item not found". Window/thresholds: ResilienceConfig.
resilience:
  ollama:
    wait-open-seconds: 30
  port-service:
    wait-open-seconds: 30

port:
  service:
    url: ${PORT_SERVICE_URL:http://localhost:9000}
    api-key: ${PORT_SERVICE_API_KEY:local-dev-api-key}

# Multi-tenancy (Phase 2.2). default-id = the V18 seed tenant; used only for pre-2.2
# in-flight outbox events and the env-mailbox bootstrap import. An unset TenantContext
# throws since S3 — there is no default-tenant fallback any more.
tenant:
  default-id: 1

# Per-tenant mailboxes (Phase 2.2 S3). The reconciler diffs tenant_mailbox rows against
# running IMAP adapters every interval; encryption-key (base64, 32 bytes — generate with
# `openssl rand -base64 32`) protects stored IMAP passwords. Without the key the app runs,
# but no adapters start and mailboxes cannot be saved.
mailbox:
  reconcile-interval-ms: 30000
  encryption-key: ${MAILBOX_ENCRYPTION_KEY:}

# Demo mail harness (Phase 4.8 S2): demo tenants read GreenMail, reply into Mailpit.
# How to run it (compose or IDE): see the header of scripts/demo-mail.ps1.
demo:
  mail:
    enabled: ${DEMO_MAIL_ENABLED:false}
    imap-host: ${DEMO_IMAP_HOST:greenmail}
    smtp-host: ${DEMO_SMTP_HOST:mailpit}
    # Mirrored in scripts/demo-mail.ps1 ($inboxes) — keep them in sync.
    inboxes:
      # Tenant 1 watches TWO inboxes: each enquiry is answered FROM the inbox it arrived on.
      1: [ops@felixstowe-freight.example.com, quotes@felixstowe-freight.example.com]
      90001: [dispatch@midlands-haulage.example.com]

# Login brute-force protection (Phase 2.3) is delegated to Keycloak (realm setting
# bruteForceProtected) — the Phase 2.6 Redis login throttle was removed with form login.

# Keycloak Admin REST client (Phase 2.3 S2). KeycloakAdminService provisions tenants' operators
# (create/list/delete, tenant_id attribute, realm roles, password reset) via the realm Admin API.
# server-url is the realm-less base (no /realms/...); the service-account client below holds the
# realm-management roles (see keycloak/realm-smartfreight.json). NOT the same client as login.
keycloak:
  admin:
    server-url: ${KEYCLOAK_SERVER_URL:http://keycloak:8081}
    realm: ${KEYCLOAK_REALM:smartfreight}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:smartfreight-admin}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:smartfreight-admin-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [ticket:%X{ticketId}] [msg:%X{messageId}] %-5level %logger{36} - %msg%n"
  level:
    com.smartfreight: DEBUG
    org.springframework.integration: INFO
