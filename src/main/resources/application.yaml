spring:
  application:
    name: smart-freight-inbox

  thymeleaf:
    cache: false

  datasource:
    url: jdbc:postgresql://localhost:5433/smartfreight
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    connect-retries: 5
    url: jdbc:postgresql://localhost:5433/smartfreight
    user: postgres
    password: postgres

  mail:
    host: ${IMAP_HOST:imap.example.com}
    port: ${IMAP_PORT:993}
    username: ${IMAP_USER:inbox@example.com}
    password: ${IMAP_PASSWORD:changeme}
    properties:
      mail:
        imap:
          connectiontimeout: 10000
          timeout: 60000
          ssl:
            enable: true

ollama:
  base-url: ${OLLAMA_URL:http://localhost:11434}
  extraction-model: qwen2.5:7b
  drafting-model: llama3.1:8b

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [ticket:%X{ticketId}] [msg:%X{messageId}] %-5level %logger{36} - %msg%n"
  level:
    com.smartfreight: DEBUG
    org.springframework.integration: INFO
