server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 8h

spring:
  application:
    name: smart-freight-inbox

  thymeleaf:
    cache: false

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/smartfreight}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    connect-retries: 5

  mail:
    host: ${IMAP_HOST:imap.example.com}
    port: ${IMAP_PORT:993}
    username: ${IMAP_USER:inbox@example.com}
    password: ${IMAP_PASSWORD:changeme}
    properties:
      mail:
        imap:
          connectiontimeout: 10000
          timeout: 60000
          ssl:
            enable: true

smtp:
  host: ${SMTP_HOST:smtp.gmail.com}
  port: ${SMTP_PORT:587}
  username: ${SMTP_USER:inbox@example.com}
  password: ${SMTP_PASSWORD:changeme}

ollama:
  base-url: ${OLLAMA_URL:http://localhost:11434}
  extraction-model: qwen2.5:7b
  drafting-model: llama3.1:8b

port:
  service:
    url: ${PORT_SERVICE_URL:http://localhost:9000}
    api-key: ${PORT_SERVICE_API_KEY:smartfreight-port-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [ticket:%X{ticketId}] [msg:%X{messageId}] %-5level %logger{36} - %msg%n"
  level:
    com.smartfreight: DEBUG
    org.springframework.integration: INFO
