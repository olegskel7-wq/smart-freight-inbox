<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tickets — Smart Freight Inbox</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand fw-bold">Smart Freight Inbox</span>
        <form method="post" action="/logout">
            <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
        </form>
    </div>
</nav>

<!-- Content -->
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">Email Tickets</h5>
        <span class="badge bg-secondary" th:text="${tickets.size()} + ' total'">0 total</span>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>From</th>
                        <th>Subject</th>
                        <th>Container</th>
                        <th>Status</th>
                        <th>Created</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="ticket : ${tickets}">
                        <td class="text-muted small" th:text="${ticket.id}">1</td>
                        <td th:text="${ticket.senderEmail}">example@mail.com</td>
                        <td th:text="${ticket.subject}">Subject</td>
                        <td>
                            <code th:if="${ticket.extractedContainerNumber != null}"
                                  th:text="${ticket.extractedContainerNumber}">MSCU1234567</code>
                            <span th:if="${ticket.extractedContainerNumber == null}"
                                  class="text-muted">—</span>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${ticket.status.name() == 'DRAFT_READY'  ? 'bg-success'  :
                                                   ticket.status.name() == 'PROCESSING'    ? 'bg-warning text-dark' :
                                                   ticket.status.name() == 'FAILED'        ? 'bg-danger'   :
                                                   ticket.status.name() == 'RETRY_LATER'   ? 'bg-warning text-dark' :
                                                   ticket.status.name() == 'CLOSED'        ? 'bg-secondary':
                                                                                             'bg-primary'}"
                                  th:text="${ticket.status}">NEW</span>
                        </td>
                        <td class="small text-muted"
                            th:text="${#temporals.format(ticket.createdAt, 'dd.MM.yyyy HH:mm')}">
                            01.01.2025 12:00
                        </td>
                        <td>
                            <a th:href="@{/tickets/{id}(id=${ticket.id})}"
                               class="btn btn-sm btn-outline-secondary">View</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(tickets)}">
                        <td colspan="7" class="text-center text-muted py-5">
                            No tickets yet — waiting for emails via IMAP IDLE&hellip;
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
