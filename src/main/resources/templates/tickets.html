<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tickets — Smart Freight Inbox</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar('tickets')}"></nav>

<!-- Content -->
<div class="container mt-4">

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <strong>&#10003;</strong> <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!--
        Каждый кликабельный заголовок строит ссылку на тот же /tickets с обновлённым
        sort/dir, но обязательно сохраняет текущий status-фильтр (statusFilter).
        При клике на уже активную колонку направление переворачивается (asc ⇄ desc),
        иначе подставляется direction по умолчанию (desc для дат, asc для текста).
    -->

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h5 class="mb-0">Email Tickets</h5>

        <div class="d-flex align-items-center gap-2">
            <!-- Status filter -->
            <form method="get" action="/tickets" class="d-flex align-items-center gap-2">
                <input type="hidden" name="sort" th:value="${sort}">
                <input type="hidden" name="dir" th:value="${dir}">

                <label for="statusFilter" class="mb-0 small fw-semibold text-dark text-nowrap">Filter by status:</label>
                <select id="statusFilter"
                        name="status"
                        class="form-select form-select-sm"
                        style="width: auto;"
                        onchange="this.form.submit()">
                    <option value="" th:selected="${statusFilter == ''}">All statuses</option>
                    <option th:each="s : ${allStatuses}"
                            th:value="${s.name()}"
                            th:text="${s.name()}"
                            th:selected="${statusFilter == s.name()}">NEW</option>
                </select>

                <a th:if="${statusFilter != '' or sort != 'createdAt' or dir != 'desc'}"
                   href="/tickets" class="btn btn-sm btn-outline-secondary"
                   title="Clear filter and reset sorting to default (Created ▼)">Reset</a>
            </form>

            <span class="badge bg-secondary"
                  th:text="${ticketPage.totalElements} + ' total, showing ' + ${tickets.size()}">0 shown</span>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-dark">
                    <tr>
                        <th th:with="col='id', label='#', defDir='asc',
                                     active=${sort == col},
                                     nextDir=${active ? (dir == 'asc' ? 'desc' : 'asc') : defDir}">
                            <a th:href="@{/tickets(sort=${col}, dir=${nextDir}, status=${statusFilter})}"
                               class="text-white text-decoration-none d-inline-flex align-items-center gap-1">
                                <span th:text="${label}">#</span>
                                <span th:if="${active}" class="small"
                                      th:text="${dir == 'asc' ? '▲' : '▼'}">▼</span>
                                <span th:unless="${active}" class="small text-white-50">⇅</span>
                            </a>
                        </th>
                        <th th:with="col='senderEmail', label='From', defDir='asc',
                                     active=${sort == col},
                                     nextDir=${active ? (dir == 'asc' ? 'desc' : 'asc') : defDir}">
                            <a th:href="@{/tickets(sort=${col}, dir=${nextDir}, status=${statusFilter})}"
                               class="text-white text-decoration-none d-inline-flex align-items-center gap-1">
                                <span th:text="${label}">From</span>
                                <span th:if="${active}" class="small"
                                      th:text="${dir == 'asc' ? '▲' : '▼'}">▼</span>
                                <span th:unless="${active}" class="small text-white-50">⇅</span>
                            </a>
                        </th>
                        <th th:with="col='subject', label='Subject', defDir='asc',
                                     active=${sort == col},
                                     nextDir=${active ? (dir == 'asc' ? 'desc' : 'asc') : defDir}">
                            <a th:href="@{/tickets(sort=${col}, dir=${nextDir}, status=${statusFilter})}"
                               class="text-white text-decoration-none d-inline-flex align-items-center gap-1">
                                <span th:text="${label}">Subject</span>
                                <span th:if="${active}" class="small"
                                      th:text="${dir == 'asc' ? '▲' : '▼'}">▼</span>
                                <span th:unless="${active}" class="small text-white-50">⇅</span>
                            </a>
                        </th>
                        <th th:with="col='extractedIdentifier', label='Identifier', defDir='asc',
                                     active=${sort == col},
                                     nextDir=${active ? (dir == 'asc' ? 'desc' : 'asc') : defDir}">
                            <a th:href="@{/tickets(sort=${col}, dir=${nextDir}, status=${statusFilter})}"
                               class="text-white text-decoration-none d-inline-flex align-items-center gap-1">
                                <span th:text="${label}">Identifier</span>
                                <span th:if="${active}" class="small"
                                      th:text="${dir == 'asc' ? '▲' : '▼'}">▼</span>
                                <span th:unless="${active}" class="small text-white-50">⇅</span>
                            </a>
                        </th>
                        <th th:with="col='ticketType', label='Type', defDir='asc',
                                     active=${sort == col},
                                     nextDir=${active ? (dir == 'asc' ? 'desc' : 'asc') : defDir}">
                            <a th:href="@{/tickets(sort=${col}, dir=${nextDir}, status=${statusFilter})}"
                               class="text-white text-decoration-none d-inline-flex align-items-center gap-1">
                                <span th:text="${label}">Type</span>
                                <span th:if="${active}" class="small"
                                      th:text="${dir == 'asc' ? '▲' : '▼'}">▼</span>
                                <span th:unless="${active}" class="small text-white-50">⇅</span>
                            </a>
                        </th>
                        <th th:with="col='status', label='Status', defDir='asc',
                                     active=${sort == col},
                                     nextDir=${active ? (dir == 'asc' ? 'desc' : 'asc') : defDir}">
                            <a th:href="@{/tickets(sort=${col}, dir=${nextDir}, status=${statusFilter})}"
                               class="text-white text-decoration-none d-inline-flex align-items-center gap-1">
                                <span th:text="${label}">Status</span>
                                <span th:if="${active}" class="small"
                                      th:text="${dir == 'asc' ? '▲' : '▼'}">▼</span>
                                <span th:unless="${active}" class="small text-white-50">⇅</span>
                            </a>
                        </th>
                        <th th:with="col='slaDeadlineAt', label='SLA', defDir='asc',
                                     active=${sort == col},
                                     nextDir=${active ? (dir == 'asc' ? 'desc' : 'asc') : defDir}">
                            <a th:href="@{/tickets(sort=${col}, dir=${nextDir}, status=${statusFilter})}"
                               class="text-white text-decoration-none d-inline-flex align-items-center gap-1">
                                <span th:text="${label}">SLA</span>
                                <span th:if="${active}" class="small"
                                      th:text="${dir == 'asc' ? '▲' : '▼'}">▼</span>
                                <span th:unless="${active}" class="small text-white-50">⇅</span>
                            </a>
                        </th>
                        <th th:with="col='createdAt', label='Created', defDir='desc',
                                     active=${sort == col},
                                     nextDir=${active ? (dir == 'asc' ? 'desc' : 'asc') : defDir}">
                            <a th:href="@{/tickets(sort=${col}, dir=${nextDir}, status=${statusFilter})}"
                               class="text-white text-decoration-none d-inline-flex align-items-center gap-1">
                                <span th:text="${label}">Created</span>
                                <span th:if="${active}" class="small"
                                      th:text="${dir == 'asc' ? '▲' : '▼'}">▼</span>
                                <span th:unless="${active}" class="small text-white-50">⇅</span>
                            </a>
                        </th>
                        <th th:with="col='updatedAt', label='Updated', defDir='desc',
                                     active=${sort == col},
                                     nextDir=${active ? (dir == 'asc' ? 'desc' : 'asc') : defDir}">
                            <a th:href="@{/tickets(sort=${col}, dir=${nextDir}, status=${statusFilter})}"
                               class="text-white text-decoration-none d-inline-flex align-items-center gap-1">
                                <span th:text="${label}">Updated</span>
                                <span th:if="${active}" class="small"
                                      th:text="${dir == 'asc' ? '▲' : '▼'}">▼</span>
                                <span th:unless="${active}" class="small text-white-50">⇅</span>
                            </a>
                        </th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="ticket : ${tickets}">
                        <td class="text-muted small" th:text="${ticket.id}">1</td>
                        <td th:text="${ticket.senderEmail}">example@mail.com</td>
                        <td th:text="${ticket.subject}">Subject</td>
                        <td>
                            <code th:if="${ticket.extractedIdentifier != null}"
                                  th:text="${ticket.extractedIdentifier}">MSCU1234567</code>
                            <span th:if="${ticket.extractedIdentifier == null}"
                                  class="text-muted">—</span>
                        </td>
                        <td>
                            <span th:if="${ticket.ticketType != null}" class="badge bg-light text-dark border"
                                  th:text="${ticket.ticketType}">RFQ</span>
                            <span th:if="${ticket.ticketType == null}" class="text-muted">—</span>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${ticket.status.name() == 'DRAFT_READY'  ? 'bg-success'  :
                                                   ticket.status.name() == 'PROCESSING'    ? 'bg-warning text-dark' :
                                                   ticket.status.name() == 'FAILED'        ? 'bg-danger'   :
                                                   ticket.status.name() == 'RETRY_LATER'   ? 'bg-warning text-dark' :
                                                   ticket.status.name() == 'CLOSED'        ? 'bg-secondary':
                                                   ticket.status.name() == 'RECEIVED'      ? 'bg-info text-dark' :
                                                   ticket.status.name() == 'IRRELEVANT'    ? 'bg-dark' :
                                                                                             'bg-primary'}"
                                  th:text="${ticket.status}">NEW</span>
                        </td>
                        <td class="small">
                            <span th:if="${ticket.slaBreached}" class="badge bg-danger"
                                  th:text="'Breached ' + ${#temporals.format(ticket.slaDeadlineAt, 'dd.MM HH:mm')}">Breached</span>
                            <span th:if="${!ticket.slaBreached and ticket.slaDeadlineAt != null}"
                                  class="text-muted"
                                  th:text="${#temporals.format(ticket.slaDeadlineAt, 'dd.MM HH:mm')}">01.01 12:00</span>
                            <span th:if="${!ticket.slaBreached and ticket.slaDeadlineAt == null}"
                                  class="text-muted">—</span>
                        </td>
                        <td class="small text-muted"
                            th:text="${#temporals.format(ticket.createdAt, 'dd.MM.yyyy HH:mm')}">
                            01.01.2025 12:00
                        </td>
                        <td class="small text-muted"
                            th:text="${ticket.updatedAt != null ? #temporals.format(ticket.updatedAt, 'dd.MM.yyyy HH:mm') : '—'}">
                            01.01.2025 12:00
                        </td>
                        <td class="d-flex gap-1">
                            <a th:href="@{/tickets/{id}(id=${ticket.id})}"
                               class="btn btn-sm btn-outline-secondary">View</a>
                            <form method="post"
                                  th:action="@{/tickets/{id}/delete(id=${ticket.id})}"
                                  onsubmit="return confirm('Delete ticket #[[${ticket.id}]]? This cannot be undone.')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(tickets)}">
                        <td colspan="10" class="text-center text-muted py-5">
                            No tickets match the current filter.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Pagination -->
<div class="container mt-3" th:if="${ticketPage.totalPages > 1}">
    <nav>
        <ul class="pagination pagination-sm justify-content-center flex-wrap">
            <li class="page-item" th:classappend="${ticketPage.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/tickets(page=${ticketPage.number - 1}, sort=${sort}, dir=${dir}, status=${statusFilter})}"
                   aria-label="Previous">&laquo;</a>
            </li>
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, ticketPage.totalPages - 1)}"
                th:classappend="${i == ticketPage.number} ? 'active'">
                <a class="page-link"
                   th:href="@{/tickets(page=${i}, sort=${sort}, dir=${dir}, status=${statusFilter})}"
                   th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${ticketPage.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/tickets(page=${ticketPage.number + 1}, sort=${sort}, dir=${dir}, status=${statusFilter})}"
                   aria-label="Next">&raquo;</a>
            </li>
        </ul>
    </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
