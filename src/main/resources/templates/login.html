<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login — Smart Freight Inbox</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

<div style="width: 100%; max-width: 420px;">
    <div class="text-center mb-4">
        <h4 class="fw-bold">Smart Freight Inbox</h4>
        <p class="text-muted small">AI-powered logistics email processing</p>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h5 class="card-title mb-4">Sign In</h5>

            <div th:if="${param.error}" class="alert alert-danger py-2">Неверный email или пароль</div>
            <div th:if="${param.blocked}" class="alert alert-warning py-2">
                Слишком много неудачных попыток. Попробуйте позже.</div>
            <div th:if="${param.expired}" class="alert alert-info py-2">Сессия истекла, войдите снова</div>
            <div th:if="${param.logout}" class="alert alert-success py-2">Вы вышли из системы</div>

            <form method="post" th:action="@{/login}">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="text" class="form-control" id="email" name="email"
                           placeholder="operator@smartfreight.com" autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign In</button>
            </form>
        </div>
    </div>

</div>

</body>
</html>
