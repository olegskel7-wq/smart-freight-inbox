<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>

<!--
  Shared navbar fragment.
  Usage: <nav th:replace="~{fragments/navbar :: navbar(active='tickets')}"></nav>
  active = 'tickets' | 'analytics' | 'rates' | 'documents' | 'users' | 'settings' | 'tenants' — highlights the current section.
  The Tenants link is platform-admin only: isSuperAdmin comes from GlobalModelAttributes.
-->
<nav th:fragment="navbar(active)" class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/tickets">Smart Freight Inbox</a>
        <div class="d-flex gap-2 align-items-center">
            <a href="/tickets"
               th:classappend="${active == 'tickets'} ? 'btn-light' : 'btn-outline-light'"
               class="btn btn-sm">Tickets</a>
            <a href="/analytics"
               th:classappend="${active == 'analytics'} ? 'btn-light' : 'btn-outline-light'"
               class="btn btn-sm">Analytics</a>
            <a href="/rates"
               th:classappend="${active == 'rates'} ? 'btn-light' : 'btn-outline-light'"
               class="btn btn-sm">Rates</a>
            <a href="/documents"
               th:classappend="${active == 'documents'} ? 'btn-light' : 'btn-outline-light'"
               class="btn btn-sm">Documents</a>
            <a href="/users"
               th:classappend="${active == 'users'} ? 'btn-light' : 'btn-outline-light'"
               class="btn btn-sm">Users</a>
            <a href="/settings"
               th:classappend="${active == 'settings'} ? 'btn-light' : 'btn-outline-light'"
               class="btn btn-sm">Settings</a>
            <a href="/admin/tenants" th:if="${isSuperAdmin}"
               th:classappend="${active == 'tenants'} ? 'btn-warning' : 'btn-outline-warning'"
               class="btn btn-sm">Tenants</a>
            <form method="post" th:action="@{/logout}">
                <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

</body>
</html>
