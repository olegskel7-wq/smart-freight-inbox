<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Users — Smart Freight Inbox</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/tickets">Smart Freight Inbox</a>
        <div class="d-flex gap-2 align-items-center">
            <a href="/tickets" class="btn btn-outline-light btn-sm">Tickets</a>
            <a href="/users" class="btn btn-light btn-sm">Users</a>
            <a href="/settings" class="btn btn-outline-light btn-sm">Settings</a>
            <form method="post" th:action="@{/logout}">
                <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4" style="max-width: 860px;">

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">Operators</h5>
        <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#createModal">
            + Add operator
        </button>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}">
                        <td class="text-muted small" th:text="${u.id}">1</td>
                        <td th:text="${u.email}">user@example.com</td>
                        <td>
                            <span class="badge bg-secondary" th:text="${u.role ?: 'OPERATOR'}">OPERATOR</span>
                        </td>
                        <td class="d-flex gap-1">
                            <button class="btn btn-sm btn-outline-secondary"
                                    data-bs-toggle="modal"
                                    th:data-bs-target="'#pwModal' + ${u.id}">
                                Change password
                            </button>
                            <form method="post"
                                  th:action="@{/users/{id}/delete(id=${u.id})}"
                                  onsubmit="return confirm('Delete user [[${u.email}]]?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="4" class="text-center text-muted py-4">No users found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Create user modal -->
<div class="modal fade" id="createModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="post" th:action="@{/users/create}">
                <div class="modal-header">
                    <h5 class="modal-title">Add operator</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" name="email" class="form-control" required placeholder="operator@company.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password <span class="text-muted fw-normal">(min 8 characters)</span></label>
                        <input type="password" name="password" class="form-control" required minlength="8">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Role</label>
                        <select name="role" class="form-select">
                            <option value="OPERATOR" selected>OPERATOR</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Change password modals (one per user) -->
<div th:each="u : ${users}">
    <div class="modal fade" th:id="'pwModal' + ${u.id}" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form method="post" th:action="@{/users/{id}/password(id=${u.id})}">
                    <div class="modal-header">
                        <h5 class="modal-title">Change password — <span th:text="${u.email}"></span></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">New password <span class="text-muted fw-normal">(min 8 characters)</span></label>
                            <input type="password" name="newPassword" class="form-control" required minlength="8">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
