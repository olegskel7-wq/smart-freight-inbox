<!--
    Универсальный шаблон страницы ошибки для UI (Thymeleaf).

    Spring Boot BasicErrorController автоматически рендерит этот шаблон
    при любом необработанном исключении в @Controller-классах
    (например, в TicketViewController). Модель формируется фреймворком
    и содержит как минимум: status, error, message, path, timestamp.

    Параметры:
      ${status}    — HTTP-код ошибки (404, 403, 500, ...)
      ${error}     — короткая фраза ("Not Found", "Internal Server Error")
      ${message}   — детальное сообщение из исключения (может быть пусто)
      ${path}      — URL запроса, на котором случилась ошибка

    Если потребуется отдельный шаблон под конкретный код — создайте
    templates/error/404.html или templates/error/500.html, и Spring Boot
    выберет более специфичный из них автоматически.
-->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Error ' + ${status} + ' — Smart Freight Inbox'">Error</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<!-- Navbar — повторяет стиль остальных страниц для визуальной консистентности -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/tickets">Smart Freight Inbox</a>
    </div>
</nav>

<div class="container py-5" style="max-width: 640px;">
    <div class="card shadow-sm">
        <div class="card-body p-4 text-center">

            <!-- Крупный HTTP-код для быстрого визуального опознавания -->
            <h1 class="display-3 fw-bold text-secondary mb-2"
                th:text="${status} ?: '—'">500</h1>

            <!-- Короткое описание (Spring Boot подставит "Not Found" / "Forbidden" и т.п.) -->
            <p class="lead mb-3" th:text="${error} ?: 'Unexpected error'">Something went wrong</p>

            <!-- Детальное сообщение из исключения. Показываем только если непустое:
                 в production message может быть пустым из соображений безопасности
                 (server.error.include-message=never). -->
            <p class="text-muted small mb-4"
               th:if="${message != null and !#strings.isEmpty(message)}"
               th:text="${message}">—</p>

            <!-- Возврат пользователя в безопасное состояние — список тикетов -->
            <a href="/tickets" class="btn btn-primary">← Back to tickets</a>
        </div>
    </div>

    <!-- Технический путь запроса (для отладки в dev/staging).
         В production через server.error.include-stacktrace=never не будет stacktrace,
         но path фреймворк показывает всегда. -->
    <p class="text-center text-muted small mt-3"
       th:if="${path != null}"
       th:text="'Request path: ' + ${path}">—</p>
</div>

</body>
</html>
